<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                
                transform: rotate(90deg);
                width:1px;
                position:relative;
                top:150px;
                animation: scroll 10s ease-in-out infinite;
                background-color:aqua;
                
            }
            @keyframes scroll {
                0%{
                    height:1px;
                    width:1px;
                }
                50%{
                    height:8px;
                    width:80px;
                }
                 100%{
                    height:1px;
                    width:1px;
                }
                
            }
        </style>
    </head>
    <body>
        <div>
           
        </div>
    </body>
</html>
