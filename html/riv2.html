<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grid</title>
    <style>
        .grid-container{
            display:grid;
            grid-template-columns:auto auto auto;
            align-items: center;
            gap: 20px;
            grid-template-areas: "main main main"
                                   "vert . ."
                                   "vert . ."
                                   "vert . .";
            
            
        }
        div{
           
            border:1px solid black;
            height:100%;
            text-align: center;
            background-color: chartreuse;
            width:100%;
            border-color:black;
            transition: all 5s ease-in-out ;
        }
        .spans{
            grid-area: main;
        }   
        .spans1{
            grid-area: vert;
        }  
        select > option:hover{
            background-color: red;
            border-radius: 10px;
        }    
        .grid-container > div:hover{
            transform: scale(1.2);
            transform: rotate(720deg);
        }
        .spans1 + div{
            background-color:cyan;
        }
        .spans1 ~ div:hover{
            background-color:cyan;
           
        }
        .animee{
            margin:200px;
            width:200px;
            height:20px;
            border-radius: 10px;
            animation: round 60s linear infinite;
        }
        .animee:hover{
            animation-play-state: paused;

        }
        @keyframes round {
            0%{
                transform: rotate(0deg);
            }
            25%{
                transform: rotate(90deg);
                background-color:red;
            }
            50%{
                transform: rotate(180deg);
                background-color:green;
            }
            75%{
                transform: rotate(270deg);
                background-color: blue;
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .load{
            height: 400px;
            border:1px solid black;
            background-color: #fff;
            display:flex;
            justify-content:center;
            gap:20px;
            align-items: center;
            
        }
        .ball1{
            height:20px;
            width:20px;
            border-radius: 50%;
            animation:loading1 1.5s ease infinite;

        }
        .ball2{
            height:20px;
            width:20px;
            border-radius: 50%;
            animation:loading2 1.5s linear infinite;
            
        }
        .ball3{
            height:20px;
            width:20px;
            border-radius: 50%;
            animation:loading3 1.5s linear infinite;
            
        }
         @keyframes loading1 {
            0%{
                transform:translateY(0);
            }
            
            50%{
                transform:translateY(20px);
                
            }
            75%{
                transform:translateY(-20px);
                
            }
            100%{
                transform:translateY(0px);
                
            }
            
        }
         @keyframes loading2 {
            0%{
                transform:translateY(20px);
            }
            
            25%{
                transform:translateY(0px);
                
            }
            50%{
                transform:translateY(-20px);
                
            }
            75%{
                transform:translateY(0px);
                
            }
            100%{
                transform:translateY(20px);
            }
            
        } @keyframes loading3 {
            0%{
                transform:translateY(-20px);
            }
            
            25%{
                transform:translateY(0px);
                
            }
            50%{
                transform:translateY(20px);
                
            }
            75%{
                transform:translateY(0px);
                
            }
            100%{
                transform:translateY(-20px);
                
            }
            
        }

    </style>
</head>
<body>

    <h1>Grid Exercise</h1>

    <div class="grid-container" style="border:none; background-color: #fff;">
        <div class="spans">1</div>
        <div class="spans1">2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>
    <br>
    <br>

    <div>
        <select name="cars">
            <option value="volvo">Volvo</option>
            <option value="bmw">BMW</option>
            <option value="audi">Audi</option>
        </select>

    </div>
    <br>
    <input list="names" id="name">
        <datalist id="names">
            <option value="ashik">
            <option  value="anu">
            <option value="nabeel ">
            <option value="akash">
        </datalist>
    <label for="city">Choose a city:</label>
<input list="cities" id="city" name="city">

<datalist id="cities">
  <option value="New York">
  <option value="London">
  <option value="Tokyo">
  <option value="Paris">
</datalist>\
<div class="animee">

</div>

<div class="load">
    <div class="ball1" ></div>
    <div class="ball2" ></div>
    <div class="ball3" ></div>
</div>


</body>
</html>
