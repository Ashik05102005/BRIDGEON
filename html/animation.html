<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smooth Continuous Scroll</title>
  <style>
    .scroll-container {
      width: 100%;
      overflow: hidden;
      background: #f0f0f0;
      border: 2px solid #333;
      position: fixed;
      top:0;
    }

    .scroll-wrapper {
      display: flex;
      width: max-content;
      animation: scroll 20s linear infinite;
    }

    .scroll-list {
      display: flex;
      gap: 30px; /* spacing between items */
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .scroll-list li {
      padding: 10px 20px;
      background: lightblue;
      font-weight: bold;
      flex: 0 0 auto;
    }

    @keyframes scroll {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%); /* only half, since we duplicate */
      }
    }
  </style>
</head>
<body>
  <div class="scroll-container">
    <div class="scroll-wrapper">
      <!-- First list -->
      <ul class="scroll-list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
      </ul>
      <!-- Duplicate list immediately after -->
      <ul class="scroll-list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
      </ul>
    </div>
  </div>
</body>
</html>
